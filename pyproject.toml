[project]
name = "battle-sh"
version = "0.1.0"
description = "Terminal 2-player Battleship over a provisioned WebSocket Relay"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets>=16.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battle_sh"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
