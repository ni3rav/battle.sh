[project]
name = "battle-sh"
version = "0.1.3"
description = "Terminal two-player Battleship over a WebSocket relay"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "battle.sh contributors" }]
keywords = ["battleship", "game", "terminal", "tui", "multiplayer", "websocket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "readchar>=4.2.2",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "websockets>=16.1.1",
]

[project.urls]
Homepage = "https://github.com/ni3rav/battle.sh"
Repository = "https://github.com/ni3rav/battle.sh"
Issues = "https://github.com/ni3rav/battle.sh/issues"

[project.scripts]
battle-sh = "battle_sh.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battle_sh"]

[tool.hatch.build.targets.sdist]
include = ["src/battle_sh", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
